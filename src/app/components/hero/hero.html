<!--
  TEMPLATE HERO

  id="hero" → el navbar hace scroll hasta aquí con href="#hero"

  El hero usa un fondo visual con capas CSS (ver hero.scss):
  1. Un gradiente oscuro de fondo
  2. Un patrón decorativo con pseudo-elementos
-->
<section id="hero" class="hero" aria-labelledby="hero-title">

  <!-- Decoración de fondo: líneas/formas abstractas vía CSS -->
  <div class="hero__bg-decor" aria-hidden="true">
    <div class="hero__bg-circle hero__bg-circle--1"></div>
    <div class="hero__bg-circle hero__bg-circle--2"></div>
  </div>

  <div class="hero__content section-container">

    <!-- Etiqueta pequeña sobre el título principal -->
    <p class="hero__eyebrow">Estudio de Tatuajes Artísticos</p>

    <!--
      h1 → encabezado principal de la página, solo debe haber UNO por página.
      id="hero-title" → referenciado por aria-labelledby de la section.
    -->
    <h1 id="hero-title" class="hero__title">
      Tu Arte,<br>
      <em class="hero__title-accent">Tu Piel</em>
    </h1>

    <p class="hero__description">
      En Ink &amp; Soul transformamos tus ideas en arte permanente.
      Cada tatuaje es una historia única, trazada con precisión y pasión.
    </p>

    <!-- Grupo de botones de acción (Call To Action) -->
    <div class="hero__actions">
      <a href="#gallery" class="btn-primary">Ver Galería</a>
      <a href="#contact" class="btn-secondary">Agenda Tu Sesión</a>
    </div>

    <!-- Métricas del estudio -->
    <ul class="hero__stats" role="list" aria-label="Estadísticas del estudio">
      <li class="hero__stat">
        <span class="hero__stat-number" aria-label="Más de 500 tatuajes realizados">500+</span>
        <span class="hero__stat-label">Tatuajes</span>
      </li>
      <li class="hero__stat-divider" aria-hidden="true"></li>
      <li class="hero__stat">
        <span class="hero__stat-number" aria-label="10 años de experiencia">10</span>
        <span class="hero__stat-label">Años</span>
      </li>
      <li class="hero__stat-divider" aria-hidden="true"></li>
      <li class="hero__stat">
        <span class="hero__stat-number" aria-label="3 artistas en el equipo">3</span>
        <span class="hero__stat-label">Artistas</span>
      </li>
    </ul>
  </div>
</section>
