<!--
  TEMPLATE NAVBAR

  [class.scrolled]="scrolled()" → binding de clase condicional.
  Añade la clase CSS "scrolled" cuando scrolled() es true.
  Esto cambia el fondo del navbar al hacer scroll.

  En Angular, los paréntesis () en el template llaman a un signal para leer su valor.
-->
<header
  class="navbar"
  [class.scrolled]="scrolled()"
  role="banner"
>
  <div class="navbar__inner section-container">

    <!-- LOGO: texto decorativo del estudio -->
    <a href="#hero" class="navbar__logo" aria-label="Ink & Soul — Ir al inicio">
      <span class="navbar__logo-main">Ink</span>
      <span class="navbar__logo-sep">&amp;</span>
      <span class="navbar__logo-accent">Soul</span>
    </a>

    <!--
      NAV DE ESCRITORIO

      @for es el control de flujo nativo de Angular para iterar arrays.
      track item.href → identificador único para que Angular optimice
      el rendering (evita re-crear todos los elementos al cambiar el array).
    -->
    <nav class="navbar__nav" aria-label="Navegación principal">
      <ul class="navbar__links" role="list">
        @for (link of navLinks; track link.href) {
          <li>
            <a
              [href]="link.href"
              class="navbar__link"
              (click)="closeMenu()"
            >{{ link.label }}</a>
          </li>
        }
      </ul>
    </nav>

    <!--
      BOTÓN HAMBURGUESA (solo visible en móvil vía CSS)

      aria-expanded: comunica a lectores de pantalla si el menú está abierto.
      aria-controls: apunta al ID del elemento que controla.
      (click)="toggleMenu()" → escucha el evento clic y llama al método.
    -->
    <button
      class="navbar__hamburger"
      [class.open]="menuOpen()"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="mobile-menu"
      aria-label="Abrir menú de navegación"
      type="button"
    >
      <!-- Las tres líneas del ícono hamburguesa, animadas con CSS -->
      <span class="navbar__hamburger-line" aria-hidden="true"></span>
      <span class="navbar__hamburger-line" aria-hidden="true"></span>
      <span class="navbar__hamburger-line" aria-hidden="true"></span>
    </button>
  </div>

  <!--
    MENÚ MÓVIL

    @if muestra/oculta este bloque según la condición.
    Angular añade o elimina el elemento del DOM por completo.
    id="mobile-menu" → referenciado por aria-controls del botón hamburguesa.
  -->
  @if (menuOpen()) {
    <nav
      id="mobile-menu"
      class="navbar__mobile-menu"
      aria-label="Menú móvil"
    >
      <ul role="list">
        @for (link of navLinks; track link.href) {
          <li>
            <a
              [href]="link.href"
              class="navbar__mobile-link"
              (click)="closeMenu()"
            >{{ link.label }}</a>
          </li>
        }
      </ul>
    </nav>
  }
</header>
