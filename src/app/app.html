<!--
  TEMPLATE RAÍZ — app.html

  Aquí simplemente colocamos los componentes en el orden en que
  deben aparecer en la página.

  Cada selector (<app-navbar />, <app-hero />, etc.) corresponde
  al selector definido en el @Component de cada archivo .ts.

  La barra diagonal al final (<app-hero />) es notación de "self-closing tag",
  válida en Angular cuando el componente no tiene contenido hijo entre las etiquetas.

  <main> envuelve las secciones de contenido principal (semánticamente correcto).
  El navbar y footer quedan fuera de <main>.
-->

<!-- Barra de navegación fija en la parte superior -->
<app-navbar />

<!-- Contenido principal de la página -->
<main id="main-content">
  <app-hero />
  <app-gallery />
  <app-team />
  <app-contact />
</main>

<!-- Pie de página -->
<app-footer />
